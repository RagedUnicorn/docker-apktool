# Docker Compose configuration for Apktool
#
# Usage:
#   docker-compose run --rm apktool [apktool-options]
#
# Examples:
#   docker-compose run --rm apktool d input/hello.apk -o output/hello
#   docker-compose run --rm apktool b output/hello -o output/hello-rebuilt.apk
#
# The service mounts ./workspace as the working directory, allowing you to:
#   - Place input APKs in ./workspace/input/
#   - Find decoded projects and rebuilt APKs in ./workspace/output/
#
# The image version is set in the .env file (default: latest)
# You can override it by:
#   - Editing the .env file
#   - Setting environment variable: APKTOOL_VERSION=3.0.2 docker-compose run --rm apktool [args]

services:
  apktool:
    image: ragedunicorn/apktool:${APKTOOL_VERSION:-latest}
    volumes:
      # Mount local workspace directory for input/output files
      - ./workspace:/workspace
      # Uncomment to persist installed frameworks (apktool if) across runs
      # - apktool-framework:/home/apktool/.local/share/apktool/framework
    working_dir: /workspace
    # Remove container after execution
    stdin_open: true
    tty: true

    # Environment variables (optional)
    environment:
      - TERM=xterm-256color
      # Raise the JVM heap for large APKs (defaults to upstream's -Xmx1024M)
      # - APKTOOL_JAVA_OPTS=-Xmx4G -Dfile.encoding=utf-8

    # Resource limits (optional - uncomment to use)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 2G
    #     reservations:
    #       cpus: '1'
    #       memory: 1G

# Named volume for the framework directory (uncomment together with the
# volume mount above)
# volumes:
#   apktool-framework:
