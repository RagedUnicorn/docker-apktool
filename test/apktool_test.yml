schemaVersion: 2.0.0

fileExistenceTests:
  - name: 'Apktool wrapper script exists'
    path: '/usr/local/bin/apktool'
    shouldExist: true
    permissions: '-rwxr-xr-x'

  - name: 'Apktool jar exists'
    path: '/usr/local/bin/apktool.jar'
    shouldExist: true
    permissions: '-rw-r--r--'

  - name: 'Java runtime exists'
    path: '/usr/lib/jvm/java-21-temurin-jre/bin/java'
    shouldExist: true

  # gcompat's dynamic loader shim; required by the glibc-linked aapt2 binary
  # that apktool.jar extracts and executes on `apktool b`. Tests run against
  # the amd64 image (see workflows), where this is the expected loader path.
  - name: 'glibc loader shim exists (gcompat, needed by bundled aapt2)'
    path: '/lib/ld-linux-x86-64.so.2'
    shouldExist: true

  # Apktool aborts (even on decode) if this directory cannot be created, so it
  # is pre-created and owned by the apktool user in the Dockerfile
  - name: 'Framework directory exists'
    path: '/home/apktool/.local/share/apktool/framework'
    shouldExist: true

  - name: 'Working directory exists'
    path: '/workspace'
    shouldExist: true
    isExecutableBy: 'any'

fileContentTests:
  - name: 'CA certificates installed'
    path: '/etc/ssl/certs/ca-certificates.crt'
    expectedContents: ['-----BEGIN CERTIFICATE-----']

  - name: 'Wrapper launches the Apktool jar'
    path: '/usr/local/bin/apktool'
    expectedContents: ['exec java .*apktool\.jar']
