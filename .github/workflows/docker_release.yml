name: Release Build

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          # Single-platform, daemon-loaded, no attestation manifest so the
          # Container Structure Tests can inspect the image (an OCI index would
          # fail with "no such image"). See TEST.md troubleshooting.
          load: true
          provenance: false
          platforms: linux/amd64
          tags: ragedunicorn/apktool:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run Container Structure Tests
        env:
          APKTOOL_TEST_VERSION: test
        run: |
          echo "::notice title=🧪 Running Tests::Validating Docker image before release..."
          docker compose -f docker-compose.test.yml pull

          echo "::group::Running all Container Structure Tests"
          docker compose -f docker-compose.test.yml run --rm test-all
          echo "::endgroup::"

          echo "::notice title=✅ Tests Passed::All Container Structure Tests completed successfully!"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Build arm64 test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          provenance: false
          platforms: linux/arm64
          tags: ragedunicorn/apktool:test-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test arm64 image
        run: |
          echo "::group::Running arm64 Apktool under QEMU"
          docker run --rm --platform linux/arm64 ragedunicorn/apktool:test-arm64 --version
          echo "::endgroup::"

          # Decode only: on arm64 `apktool b` is unsupported (upstream bundles
          # only an x86_64 aapt2, see README Architecture Support)
          echo "::group::Decoding the sample APK on arm64"
          docker run --rm --platform linux/arm64 -v "$PWD/workspace/input:/input:ro" \
            ragedunicorn/apktool:test-arm64 d /input/hello.apk -o /workspace/hello
          echo "::endgroup::"

          # An amd64 JVM in the arm64 image would still run natively on the
          # amd64 runner, so also assert the ELF e_machine of the java launcher
          # is aarch64 (0xb7)
          echo "::group::Checking JVM architecture"
          MACHINE=$(docker run --rm --platform linux/arm64 --entrypoint od ragedunicorn/apktool:test-arm64 -An -tx1 -j18 -N2 /usr/lib/jvm/java-21-temurin-jre/bin/java | tr -d ' \n')
          echo "e_machine: $MACHINE"
          if [ "$MACHINE" != "b700" ]; then
            echo "::error title=❌ Wrong Architecture::java in the arm64 image is not an aarch64 binary (e_machine=$MACHINE)"
            exit 1
          fi
          echo "::endgroup::"

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # Required for cosign keyless signing (GitHub OIDC token for Fulcio)
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ secrets.DOCKERHUB_USERNAME }}/apktool
          tags: |
            # Use the tag as-is, stripping only the 'v' prefix
            # (e.g. X.Y.Z-alpineA.B.C-N)
            type=match,pattern=v(.*),group=1
            # Bare Apktool version tag (e.g. X.Y.Z). type=match instead of
            # type=semver: metadata-action treats the alpine suffix as a semver
            # prerelease and would render a semver pattern as the full version.
            # Skipped for prereleases so an RC does not move the bare version.
            type=match,pattern=v(\d+\.\d+\.\d+)-alpine,group=1,enable=${{ !contains(github.ref, '-rc') && !contains(github.ref, '-beta') && !contains(github.ref, '-alpha') }}
            # 'latest' tag for version tags (skipped for prereleases)
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-rc') && !contains(github.ref, '-beta') && !contains(github.ref, '-alpha') }}
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          sbom: true
          provenance: mode=max
      - name: Sign images with cosign
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Sign the pushed manifest list by digest once per registry repository.
          # Repository names are taken from the metadata tags, which are already
          # lowercased (GHCR rejects the mixed-case github.repository)
          for IMAGE in $(echo "$TAGS" | sed 's/:[^:/]*$//' | sort -u); do
            echo "::group::Signing ${IMAGE}@${DIGEST}"
            cosign sign --yes "${IMAGE}@${DIGEST}"
            echo "::endgroup::"
          done

  create-release:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Get previous tag
        id: prev_tag
        run: |
          # Order by tag version, not by tagged commit, so a rebuild tag (-N bump)
          # sharing a commit with the previous release still resolves correctly
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -Fx -A1 "$GITHUB_REF_NAME" | sed -n 2p)
          echo "previous_tag=$PREV_TAG" >> $GITHUB_OUTPUT
      - name: Generate changelog
        id: changelog
        run: |
          if [ -z "${{ steps.prev_tag.outputs.previous_tag }}" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" --reverse)
          else
            COMMITS=$(git log ${{ steps.prev_tag.outputs.previous_tag }}..${{ github.ref_name }} --pretty=format:"- %s (%h)" --reverse)
          fi

          # Create changelog
          {
            echo "## What's Changed"
            echo ""
            echo "$COMMITS" | grep -E "^- (feat|fix|docs|style|refactor|perf|test|chore)(\(.+\))?:" || echo "$COMMITS"
            echo ""
            echo "## Docker Image"
            echo ""
            echo "Pull the image:"
            echo '```bash'
            echo "docker pull ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME#v}"
            echo "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/apktool:${GITHUB_REF_NAME#v}"
            echo '```'
            echo ""
            echo "Or use the latest tag:"
            echo '```bash'
            echo "docker pull ghcr.io/${{ github.repository }}:latest"
            echo "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/apktool:latest"
            echo '```'
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.prev_tag.outputs.previous_tag }}...${{ github.ref_name }}"
          } > CHANGELOG.md

          # Store for release body
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<$EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG.md >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          generate_release_notes: false
          token: ${{ secrets.GITHUB_TOKEN }}
